name: CRM CI

on:
  push:
    branches:
      - feature/crm-recompra
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: CRM, WhatsApp, popup and AI calendar unit tests
        run: bunx vitest run src/lib/crm-rfm.test.ts src/lib/crm-repurchase-shared.test.ts src/lib/crm-segmentation-shared.test.ts src/lib/crm-segmentation-calendar-day.test.ts src/lib/crm-filter-catalog.test.ts src/lib/crm-product-segmentation.test.ts src/lib/crm-segment-templates.test.ts src/lib/crm-tray-import-shared.test.ts src/lib/whatsapp-automation-context.test.ts src/lib/whatsapp-automation-delivery-state.test.ts src/lib/whatsapp-automation-reentry.test.ts src/lib/whatsapp-queue-health.test.ts src/lib/whatsapp-presend-audit.test.ts src/lib/whatsapp-phone-registration.test.ts src/lib/whatsapp-template-variables.test.ts src/lib/whatsapp-opt-out.test.ts src/lib/whatsapp-audience-selection.test.ts src/lib/whatsapp-campaign-cleanup.test.ts src/lib/popup-designer.test.ts src/lib/ai-content-prompt.test.ts

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit
